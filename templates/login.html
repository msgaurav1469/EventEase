{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-side"><span class="eyebrow">WELCOME BACK</span><h1>Your next great<br><em>experience awaits.</em></h1><p>Sign in to manage your bookings and keep your plans in one place.</p></div>
<div class="form-card"><span class="eyebrow">EVENTEASE ACCOUNT</span><h2>Log in</h2><p class="muted">Good to see you again.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Email address</label><input type="email" name="email" placeholder="you@example.com" required><label>Password</label><input type="password" name="password" placeholder="Your password" required><button class="button button-dark full">Log in →</button></form>
<p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></section>
{% endblock %}
